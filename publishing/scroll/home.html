<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Scroll iPhone Effect</title>
    <style>
        body {
            margin: 0;
            height: 300vh;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        .section {
            height: 200vh;
            position: relative;
        }

        .sticky {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone {
            width: 280px;
            height: 560px;
            border: 10px solid #333;
            border-radius: 40px;
            background: black;
            overflow: hidden;
            position: relative;
            transform: scale(1);
            /*원근감*/
            perspective: 1000px;
        }

        .screen {
            width: 100%;
            height: 140%;
            background: linear-gradient(#4facfe, #00f2fe);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 60%;
            font-size: 28px;
            font-weight: bold;
            z-index: 2;
        }

        .text {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            opacity: 0;
            z-index: 10;
        }

        .card3d {
            position: absolute;
            left: 50%;
            bottom: 90px;
            width: 220px;
            height: 140px;
            border-radius: 24px;
            background: white;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;

            transform-style: preserve-3d;
            backface-visibility: visible;
            transform: translateX(-50%) rotateY(0deg);
            z-index: 3;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>

<section class="section">
    <div class="sticky">
        <div class="text">iPhone Style Scroll</div>

        <div class="phone">
            <div class="screen"></div>
            <div class="content">Hello</div>
            <div class="card3d">New Content</div>
        </div>

    </div>
</section>

<script>

    // 요소 가져오기
    const phone = document.querySelector('.phone');
    const screen = document.querySelector('.screen');
    const content = document.querySelector('.content');
    const text = document.querySelector('.text');
    const card3d = document.querySelector('.card3d');

    // 스크롤 감지
    window.addEventListener('scroll', () => {
        // 현재 스크롤 위치 가져옴
        const scrollY = window.scrollY;

        // scrollY / 1000로 스크롤 값을 비율로 변경 ex. 500 / 1000 = 0.5
        // Math.min(현재값, 최대값) 사용해서 최대값을 1로 제한
        const progress = Math.min(scrollY / 1000, 1);

        // 폰 확대
        phone.style.transform = `scale(${1 + progress * 0.5})`;

        // 내부 화면 위로 이동, 스크롤 할 수록 위로 이동
        content.style.transform = `translateY(${-progress * 300}px)`;

        // 배경 색상처럼 보이게 화면 이동, 스크롤 할 수록 위로 이동
        screen.style.transform = `translateY(${-progress * 120}px)`;

        // 텍스트 서서히 나타남
        text.style.opacity = progress;

        const rotateStart = 700;
        const rotateEnd = 1300;

        let rotateProgress = (scrollY - rotateStart) / (rotateEnd - rotateStart);
        rotateProgress = Math.min(Math.max(rotateProgress, 0), 1);

        card3d.style.transform = `
            translateX(-50%)
            rotateY(${rotateProgress * 360}deg)
            scale(${1 + rotateProgress * 0.2})
        `;
    });
</script>

</body>
</html>
