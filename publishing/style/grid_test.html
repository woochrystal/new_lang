<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>그리드 연습</title>
    <style>
        /*그리드는 플렉스처럼 부모요소에 설정*/
        /*.grid {*/
        /*    display: grid;*/
        /*    grid-template-columns: 1fr 1fr;*/
        /*    gap: 16px;*/
        /*}*/

        body > div {
            margin-bottom: 50px;
        }

        .card {
            background: #eee;
            padding: 30px;
            text-align: center;

            &.big {
                /*가로두칸*/
                grid-column: span 2;

                /*세로두칸*/
                grid-row: span 2;
            }
        }

        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid2{
            display: grid;
            /*grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));*/
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            /*flex-grow: 1;*/
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
    </div>

    <div class="grid2">
        <div class="card">1</div>
        <div class="card big">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
    </div>
</body>
</html>
