<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>그리드 연습</title>
    <style>
        /*그리드는 플렉스처럼 부모요소에 설정*/
        /*.grid {*/
        /*    display: grid;*/
        /*    grid-template-columns: 1fr 1fr;*/
        /*    gap: 16px;*/
        /*}*/

        .grid div {
            background: #eee;
            padding: 30px;
            text-align: center;
        }

        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid2{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
    <div class="grid2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
</body>
</html>
