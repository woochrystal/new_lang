<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        .gallery {
            border: 2px solid #222;
            padding: 16px;
        }

        .pic {
            background: #ddd;
            border: 2px solid #999;

            padding: 20px;

            font-size: 32px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 높이 다르게 연습용 */
        .pic:nth-child(1) {
            height: 120px;
        }

        .pic:nth-child(2) {
            height: 220px;
        }

        .pic:nth-child(3) {
            height: 160px;
        }

        .pic:nth-child(4) {
            height: 280px;
        }

        .pic:nth-child(5) {
            height: 180px;
        }

        .pic:nth-child(6) {
            height: 140px;
        }

        .pic:nth-child(7) {
            height: 260px;
        }

        .pic:nth-child(8) {
            height: 200px;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <div class="pic">1</div>
        <div class="pic">2</div>
        <div class="pic">3</div>
        <div class="pic">4</div>
        <div class="pic">5</div>
        <div class="pic">6</div>
        <div class="pic">7</div>
        <div class="pic">8</div>
    </div>
</body>
</html>
